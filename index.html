<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantastic Flyers — Memory Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div><p class="eyebrow">Fantastic Flyers <span></span> Memory game</p><h1>Match the legends</h1><p class="subtitle">Find every matching pair in the fewest moves.</p></div>
        <button class="new-game" id="new-game" type="button">↻ New game</button>
      </header>
      <section class="scoreboard" aria-label="Game status"><div><span>Moves</span><strong id="moves">0</strong></div><div><span>Pairs found</span><strong><b id="matches">0</b> / 3</strong></div><p id="status" role="status">Choose two cards to begin.</p></section>
      <section class="board" id="board" aria-label="Memory game board"></section>
    </main>
    <div class="win-screen" id="win-screen" hidden><div class="win-panel"><div class="trophy">✦</div><p class="eyebrow">Collection complete</p><h2>YOU WON!</h2><p>You matched every Fantastic Flyers pair.</p><div class="win-stats"><span><b id="win-moves">0</b> moves</span><span><b>3</b> pairs</span></div><button class="new-game" id="play-again" type="button">Play again</button></div></div>
    <script src="game.js"></script>
  </body>
</html>
